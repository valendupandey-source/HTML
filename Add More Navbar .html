<html>
    <head>
        <title> Navbar </title>
        <style>
            body {
                margin: 0;
                font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            }
            .topnav {
                overflow: hidden;
                background-color: blue;
            }
            .topnav a {
                float: left;
                color: brown;
                text-align: center;
                padding: 20px 20px;
                text-decoration: none;
                font-size: 25px;
            }
            .topnav a:hover {
                background-color: blue;
                color: black;
            }
            .topnav a.active {
                background-color: blanchedalmond;
                color: black;
            }
        </style>
    </head>
    <body>
        <div class="topnav">
            <a class="active" href="#home"> Home </a>
            <a href="#"> About Us</a>
            <a href="#"> Gallery </a>
            <a href="#"> Services </a>
            <a href="#"> Offer </a>
            <a href="#"> About The Dealer</a>
            <a href="#"> Report</a>
            <a href="#"> Location </a>
            <a href="#"> Review</a>
            <a href="#"> Contact Us</a>
        </div>
    </body>
</html>
