<html>
    <head>
        <title> Navbar </title>
        <style>
            body { 
                margin: 0;
                font-family: Arial, Helvetica, sans-serif;
            }
            .topnav {
                overflow: hidden;
                background-color: blanchedalmond;
            }
            .topnav a {
                float: left;
                color: azure;
                text-align: center;
                padding: 20px 20px;
                text-decoration: none;
                font-size: 25px;
            }
            .topnav a:hover {
                background-color: aquamarine;
                color: black;
            }
            .topnav a.active {
                background-color: blueviolet;
                color: black;
            }
            .pimg1, .pimg2, .pimg3 {
                position: relative;
                opacity: 0.70;
                background-position: center;
                background-size: cover;
                background-repeat: no-repeat;
                background-attachment: fixed;
            }
            .pimg1 {
                background-image: url('Scenery.jepg');
                min-height: 100%;
            }
            .pimg2 {
                background-image: url('Scenery2.jepg');
                min-height: 400px;
            }
            .pimg3 {
                background-image: url('Scenery3.jepg');
                min-height: 400px;
            }
            .section {
                text-align: center;
                padding: 50px 80px;
            }
            .section-light{
                background-color: black;
                color: whitesmoke;
            }
            .section-dark{
                background-color: whitesmoke;
                color: black;
            }
            .ptext{
                position: absolute;
                top: 50%;
                color: darkblue;
                font-size: 27px;
                letter-spacing: 8px;
                text-transform: uppercase;
            }
            .ptext .border {
                background-color: blanchedalmond;
                color: lawngreen;
                padding: 20px;
            }
            .ptext .border.trans {
                background-color: transparent;
            }
            @media(max-width: 568px){
                .pimg1, .pimg2, .ping3 {
                    background-attachment: scroll;
                }
            }
            .footer {
                position: fixed;
                left: 0;
                bottom: 0;
                width: 100%;
                background-color: black;
                color: white;
                text-align: center;
            }
        </style>
    </head>
    <body>
        <div class="topnav">
            <a class="active" href="#home"> Home </a>
            <a href="#">About_Us</a>
            <a href="#">Galery</a>
            <a href="#">Contact_Us</a>
        </div>
        <section>
            <img class="mySlides" src="Real1.jpeg" style="height: 500px;">
            <img class="mySides" src="Real2.jpeg" style="height: 500px;">
        </section>
        <script>
            var myIndex = 0;
            carousel();
            function carousel() {
                var i;
                var x = document.getElementsByClassName("mySlides");
                for (i = 0; i < x.length; i++) {
                    x[i].style.display = "none";
                }
                myIndex++;
                if (myIndex > x.length) { myIndex = 1}
                x[myIndex-1].style.display = "block";
                setTimeout(carousel,3000);

                
            }
        </script>
        <span class="border trans" style="font-size: 40px;">
            <center> Welcome All To This Website </center>
        </span><br>
    </head>
    <body>
        <section class="section section-dark">
            <h2>
                Section One
            </h2>
            <p> Web development is the work involved in developing a website for the Internet (World Wide Web) or an Interanet (a private network).</p>
        </section>
        <div class="pimg3">
            <div class="ptext">
                <span class="border trans"> Image Two Text</span>
            </div>
        </div>
        <body>
            <div class="footer">
                <p> @copy all rights reserved by Valendu Pandey </p>
        </body>
        </body> 
    </body>
</html>
