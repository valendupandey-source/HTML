<html>
    <head>
        <title> Navbar </title>
        <style>
            body { 
                margin: 0;
                font-family: Arial, Helvetica, sans-serif;
            }
            .topnav {
                overflow: hidden;
                background-color: blanchedalmond;
            }
            .topnav a {
                float: left;
                color: azure;
                text-align: center;
                padding: 20px 20px;
                text-decoration: none;
                font-size: 25px;
            }
            .topnav a:hover {
                background-color: aquamarine;
                color: black;
            }
            .topnav a.active {
                background-color: blueviolet;
                color: black;
            }
        </style>
    </head>
    <body>
        <div class="topnav">
            <a class="active" href="#home"> Home </a>
            <a href="#">About_Us</a>
            <a href="#">Galery</a>
            <a href="#">Contact_Us</a>
        </div>
    </body>
</html>
