<html>
    <title> Coding Languages </title>
    <section>
        <img class="mySlides" src="HTML Image.jpeg" style="height:500px; width:1340px;">
    <img class="mySlides" src="CSS Image.jpeg" style="height:500px; width:1340px;">
    <img class="mySlides" src="JS Image.jpeg" style="height:500px; width:1340px;">
</section>

<script>
    // Automatic Slideshow - change image every 3 seconds
    var myIndex = 0;
    carousel();

    function carousel() {
        var i;
        var x = document.getElementsByClassName("mySlides");
        for (i = 0; i < x.length; i++) {
            x[i].style.display = "none";
        }
        myIndex++;
        if (myIndex > x.length) { myIndex = 1 }
        x[myIndex - 1].style.display = "block";
        setTimeout(carousel, 3000);
    }
</script>
</html>
